[package]
name = "shopping-sessions"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[dependencies]
ahash = { version = "=0.8.12", default-features = false }
parquet = { version = "=58.0.0", default-features = false }
bytes = "1.10"
memmap2 = "=0.9.12"

[features]
default = ["fast-csv", "fast-hash", "fast-digits"]
fast-csv = []
fast-hash = []
fast-digits = []
