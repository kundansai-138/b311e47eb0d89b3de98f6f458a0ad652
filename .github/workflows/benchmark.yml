name: Compare production round4 with submitted baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record actual CPU capability
        id: cpu
        run: |
          mkdir -p reports/probe-${{ matrix.probe }}
          lscpu | tee reports/probe-${{ matrix.probe }}/cpu.txt
          if grep -q avx512bw /proc/cpuinfo; then echo 'avx512=true' >> "$GITHUB_OUTPUT"; else echo 'avx512=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: steps.cpu.outputs.avx512 == 'true'
      - name: Build exact baseline and production PGO images
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          mkdir /tmp/shopping-baseline
          git archive 55c31f8825654cabcfbf7ab4888116e9e93d6183 | tar -x -C /tmp/shopping-baseline
          timeout 600 docker build -t shopping-sessions:baseline /tmp/shopping-baseline
          started=$(date +%s)
          timeout 600 docker build -t shopping-sessions:optimized .
          echo "Production build seconds: $(($(date +%s)-started))" | tee reports/probe-${{ matrix.probe }}/build-time.txt
          docker image inspect shopping-sessions:optimized --format '{{.Size}}' > reports/probe-${{ matrix.probe }}/image-size.txt
      - name: Generate official twenty-million-event input
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          cargo build --release --locked --manifest-path tests/generator/Cargo.toml
          tests/generator/target/release/generate --seed 818 --events 20000000 --clicks 5000000 --threads 4 --output /tmp/shopping-data
      - name: Alternate seven full runs and compare every output row
        if: steps.cpu.outputs.avx512 == 'true'
        run: python tests/benchmark.py /tmp/shopping-data reports/probe-${{ matrix.probe }} --repeats 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-production-${{ matrix.probe }}
          path: reports/
