name: Screen exact round4 candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build controlled candidate images
        run: |
          for variant in baseline architecture parser inline; do
            context=/tmp/round4-$variant
            mkdir "$context"
            git archive 55c31f8825654cabcfbf7ab4888116e9e93d6183 | tar -x -C "$context"
            cp .bench/Dockerfile "$context/Dockerfile"
            if [ "$variant" != baseline ]; then cp .bench/$variant/src/* "$context/src/"; fi
            timeout 600 docker build -t shopping-sessions:$variant "$context"
          done
      - name: Generate official twenty-million-event input
        run: |
          cargo build --release --locked --manifest-path tests/generator/Cargo.toml
          tests/generator/target/release/generate --seed 818 --events 20000000 --clicks 5000000 --threads 4 --output /tmp/shopping-data
      - name: Rotate five runs and compare every output row
        run: |
          mkdir benchmark-results
          lscpu > benchmark-results/cpu.txt
          python tests/benchmark.py /tmp/shopping-data benchmark-results --repeats 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-linux-screen
          path: benchmark-results/
