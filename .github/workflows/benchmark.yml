name: Screen fused parser, preloading and compiler
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check actual CPU capability
        id: cpu
        run: |
          mkdir -p reports/probe-${{ matrix.probe }}
          lscpu | tee reports/probe-${{ matrix.probe }}/cpu.txt
          if grep -q avx512bw /proc/cpuinfo; then echo 'avx512=true' >> "$GITHUB_OUTPUT"; else echo 'avx512=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: steps.cpu.outputs.avx512 == 'true'
      - name: Build controlled candidate images and native tests
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          for variant in baseline vector fused fusedpreload fused_new; do
            context=/tmp/round4-$variant
            mkdir "$context"
            git archive 55c31f8825654cabcfbf7ab4888116e9e93d6183 | tar -x -C "$context"
            cp .bench/Dockerfile "$context/Dockerfile"
            source=$variant
            rust=1.90.0
            if [ "$variant" = fused_new ]; then source=fused; rust=1.100.0; fi
            check=0
            if [ "$variant" != baseline ]; then
              cp .bench/$source/src/* "$context/src/"
              cp .bench/$source/Cargo.toml .bench/$source/build.rs "$context/"
              check=1
            fi
            timeout 600 docker build --build-arg CHECK_UNITS=$check --build-arg RUST_VERSION=$rust -t shopping-sessions:$variant "$context"
          done
      - name: Generate official twenty-million-event input
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          cargo build --release --locked --manifest-path tests/generator/Cargo.toml
          tests/generator/target/release/generate --seed 818 --events 20000000 --clicks 5000000 --threads 4 --output /tmp/shopping-data
      - name: Rotate five runs and compare every output row
        if: steps.cpu.outputs.avx512 == 'true'
        run: python tests/benchmark.py /tmp/shopping-data reports/probe-${{ matrix.probe }} --repeats 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-fused-${{ matrix.probe }}
          path: reports/
