name: Screen catalog and real AVX512 candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check actual CPU capability
        id: cpu
        run: |
          mkdir -p reports/probe-${{ matrix.probe }}
          lscpu | tee reports/probe-${{ matrix.probe }}/cpu.txt
          if grep -q avx512bw /proc/cpuinfo; then echo 'avx512=true' >> "$GITHUB_OUTPUT"; else echo 'avx512=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: steps.cpu.outputs.avx512 == 'true'
      - name: Build controlled candidate images and native tests
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          for variant in baseline catalog combined vector; do
            context=/tmp/round4-$variant
            mkdir "$context"
            git archive 55c31f8825654cabcfbf7ab4888116e9e93d6183 | tar -x -C "$context"
            cp .bench/Dockerfile "$context/Dockerfile"
            if [ "$variant" != baseline ]; then cp .bench/$variant/src/* "$context/src/"; fi
            check=0
            if [ "$variant" = vector ]; then cp .bench/vector/Cargo.toml .bench/vector/build.rs "$context/"; check=1; fi
            timeout 600 docker build --build-arg CHECK_UNITS=$check -t shopping-sessions:$variant "$context"
          done
      - name: Generate official twenty-million-event input
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          cargo build --release --locked --manifest-path tests/generator/Cargo.toml
          tests/generator/target/release/generate --seed 818 --events 20000000 --clicks 5000000 --threads 4 --output /tmp/shopping-data
      - name: Rotate five runs and compare every output row
        if: steps.cpu.outputs.avx512 == 'true'
        run: python tests/benchmark.py /tmp/shopping-data reports/probe-${{ matrix.probe }} --repeats 5
      - name: Collect symbolized CPU samples
        if: steps.cpu.outputs.avx512 == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
          sudo sysctl kernel.perf_event_paranoid=-1
          perf --version
          id=$(docker create shopping-sessions:baseline)
          docker cp "$id:/app/shopping-sessions" /tmp/shopping-sessions
          docker rm "$id"
          chmod +x /tmp/shopping-sessions
          mkdir /tmp/profile-output /tmp/profile-scratch
          export DATA_DIR=/tmp/shopping-data OUTPUT_DIR=/tmp/profile-output SCRATCH_DIR=/tmp/profile-scratch NCPU=8 MEM_GB=12
          perf record -e cpu-clock -F 999 -o /tmp/perf.data --call-graph dwarf,4096 -- /tmp/shopping-sessions 2> reports/probe-${{ matrix.probe }}/profile-runtime.log
          perf report -i /tmp/perf.data --stdio --no-children --percent-limit 0.3 > reports/probe-${{ matrix.probe }}/profile-report.txt
          perf report -i /tmp/perf.data --stdio --no-children --sort symbol --percent-limit 0.3 > reports/probe-${{ matrix.probe }}/profile-symbols.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-vector-${{ matrix.probe }}
          path: reports/
