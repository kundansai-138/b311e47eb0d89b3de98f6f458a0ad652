name: Compare combined round-two candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build exact baseline and isolated candidates
        run: |
          timeout 600 docker build -t shopping-sessions:baseline .
          for variant in combined dense; do
            timeout 600 docker build -t shopping-sessions:$variant .bench/$variant
          done
      - name: Generate official twenty-million-event dataset
        run: |
          cargo build --release --locked --offline --manifest-path tests/generator/Cargo.toml
          tests/generator/target/release/generate --seed 818 --events 20000000 --clicks 5000000 --threads 4 --output /tmp/shopping-data
      - name: Rotate three runs per candidate with eight workers
        run: |
          mkdir benchmark-results
          lscpu > benchmark-results/cpu.txt
          python tests/benchmark.py /tmp/shopping-data benchmark-results --repeats 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-linux-candidates
          path: benchmark-results/
