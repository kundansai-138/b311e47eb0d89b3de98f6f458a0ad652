name: Validate Linux container
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: timeout 600 docker build --platform linux/amd64 -t shopping-sessions:latest .
      - name: Check image size
        run: |
          size=$(docker image inspect shopping-sessions:latest --format '{{.Size}}')
          echo "Image size: $size bytes"
          test "$size" -le 8589934592
      - name: Supplied fixtures under scorer filesystem restrictions
        env:
          CPUS: '2'
          MEM: 5g
        run: python scripts/run_fixtures.py fixtures -- sh scripts/docker_run.sh
      - name: Additional adversarial cases
        env:
          CPUS: '2'
          MEM: 5g
        run: |
          python tests/generate_cases.py --output /tmp/adversarial
          python scripts/run_fixtures.py /tmp/adversarial -- sh scripts/docker_run.sh
      - name: Generate and validate public development dataset
        env:
          CPUS: '2'
          MEM: 5g
        run: |
          cargo build --release --locked --offline --manifest-path tests/generator/Cargo.toml
          tests/generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --threads 2 --output /tmp/public-dev
          sh scripts/docker_run.sh /tmp/public-dev /tmp/public-dev-output
          python tests/check_dev.py /tmp/public-dev-output
      - name: Exact ID fallback and cross-worker regression
        run: |
          python tests/generate_id_cases.py --output /tmp/exact-ids --large
          CPUS=1 MEM=5g python scripts/run_fixtures.py /tmp/exact-ids -- sh scripts/docker_run.sh
          CPUS=2 WORKERS=8 MEM=5g python scripts/run_fixtures.py /tmp/exact-ids -- sh scripts/docker_run.sh
      - name: Packed-domain and shared-writer regression
        run: |
          python tests/generate_layout_cases.py --output /tmp/layout-cases --writer
          CPUS=1 MEM=5g python scripts/run_fixtures.py /tmp/layout-cases -- sh scripts/docker_run.sh
      - name: Exact catalog domains and explicit AVX2 fallback
        run: |
          lscpu
          python tests/generate_catalog_cases.py --output /tmp/catalog-cases
          CPUS=2 WORKERS=8 MEM=5g python scripts/run_fixtures.py /tmp/catalog-cases -- sh scripts/docker_run.sh
          SHOP_CSV_BACKEND=avx2 SHOP_SORT_BACKEND=avx2 CPUS=2 MEM=5g python scripts/run_fixtures.py fixtures -- sh scripts/docker_run.sh
          SHOP_CSV_BACKEND=avx2 SHOP_SORT_BACKEND=avx2 CPUS=2 MEM=5g python scripts/run_fixtures.py /tmp/catalog-cases -- sh scripts/docker_run.sh
